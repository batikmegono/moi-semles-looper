<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seamless Audio Looper - MOI Apps Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom Glassmorphism & Gradients */
        body { background-color: #0f172a; }
        .glass-panel {
            background: rgba(30, 41, 59, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .glow-teal {
            box-shadow: 0 0 25px rgba(45, 212, 191, 0.3);
        }
    </style>
</head>
<body class="text-slate-200 min-h-screen flex flex-col items-center justify-center p-4 relative overflow-hidden font-sans">
    
    <!-- Background Gradients (Vibrant Highlights) -->
    <div class="absolute top-[-10%] left-[-10%] w-96 h-96 bg-teal-500/20 rounded-full blur-[100px] pointer-events-none"></div>
    <div class="absolute bottom-[-10%] right-[-10%] w-96 h-96 bg-indigo-600/20 rounded-full blur-[100px] pointer-events-none"></div>

    <!-- Main App Container -->
    <div class="glass-panel p-8 rounded-2xl shadow-2xl max-w-md w-full z-10 relative">
        
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-teal-400 to-indigo-400 mb-2">
                MOI Apps Looper
            </h1>
            <p class="text-sm text-slate-400">Seamless 2-Hour Audio Generator</p>
        </div>

        <!-- Dropzone Area -->
        <div id="dropzone" class="border-2 border-dashed border-teal-500/40 rounded-xl p-8 text-center cursor-pointer hover:bg-teal-500/10 hover:border-teal-400 transition-all duration-300 mb-6 group relative">
            <input type="file" id="fileInput" accept="audio/*" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer">
            
            <div id="uploadText">
                <svg class="w-12 h-12 mx-auto text-teal-500 mb-3 group-hover:scale-110 group-hover:text-teal-400 transition-all duration-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path></svg>
                <p class="text-slate-300 font-medium">Drag & Drop audio di sini</p>
                <p class="text-xs text-slate-500 mt-2">atau klik area ini untuk unggah (MP3/WAV)</p>
            </div>
            
            <div id="fileInfo" class="hidden">
                <svg class="w-12 h-12 mx-auto text-teal-400 mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19V6l12-3v13M9 19c-1.105 0-2-.895-2-2s.895-2 2-2 2 .895 2 2-.895 2-2 2zm12-3c-1.105 0-2-.895-2-2s.895-2 2-2 2 .895 2 2-.895 2-2 2z"></path></svg>
                <p id="fileName" class="text-teal-300 font-semibold truncate px-2"></p>
            </div>
        </div>

        <!-- Audio Controls -->
        <div class="space-y-4">
            <button id="playBtn" disabled class="w-full py-3.5 rounded-lg bg-teal-500 text-gray-900 font-bold tracking-wide disabled:opacity-50 disabled:cursor-not-allowed hover:bg-teal-400 hover:glow-teal transition-all flex items-center justify-center gap-2 relative z-20">
                <span id="playIcon">▶️</span> <span id="playText">Play Seamless Preview</span>
            </button>

            <button id="exportBtn" disabled class="w-full py-3.5 rounded-lg bg-gradient-to-r from-indigo-600 to-indigo-500 text-white font-bold tracking-wide disabled:opacity-50 disabled:cursor-not-allowed hover:from-indigo-500 hover:to-indigo-400 transition-all shadow-lg flex items-center justify-center gap-2 relative z-20">
                💾 Export 2-Hour Loop
            </button>
        </div>
        
        <!-- Branding & Contact -->
        <div class="mt-8 pt-5 border-t border-slate-700/60 text-center">
            <p class="text-[11px] text-teal-400/80 font-bold tracking-widest uppercase">MOI Apps Studio</p>
            <p class="text-[10px] text-slate-500 mt-1.5">Jl. Rimat Bakti No. 40, Karanganyar, Batang, Jawa Tengah 51216</p>
            <p class="text-[10px] text-slate-500 mt-0.5">WhatsApp: 08197653003</p>
        </div>
    </div>

    <!-- Logic JavaScript -->
    <script>
        const fileInput = document.getElementById('fileInput');
        const dropzone = document.getElementById('dropzone');
        const uploadText = document.getElementById('uploadText');
        const fileInfo = document.getElementById('fileInfo');
        const fileNameDisplay = document.getElementById('fileName');
        
        const playBtn = document.getElementById('playBtn');
        const exportBtn = document.getElementById('exportBtn');
        const playIcon = document.getElementById('playIcon');
        const playText = document.getElementById('playText');

        let audioContext = null;
        let audioBuffer = null;
        let sourceNode = null;
        let isPlaying = false;

        // UI Updates saat drag
        ['dragenter', 'dragover'].forEach(evt => {
            dropzone.addEventListener(evt, (e) => {
                e.preventDefault();
                dropzone.classList.add('bg-teal-500/20', 'border-teal-400');
            });
        });

        ['dragleave', 'drop'].forEach(evt => {
            dropzone.addEventListener(evt, (e) => {
                e.preventDefault();
                dropzone.classList.remove('bg-teal-500/20', 'border-teal-400');
            });
        });

        // Deteksi file saat drop atau klik
        dropzone.addEventListener('drop', (e) => {
            if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
        });
        
        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length) handleFile(e.target.files[0]);
        });

        // Proses File & Web Audio API
        async function handleFile(file) {
            if (!file.type.startsWith('audio/')) {
                alert('Silakan unggah file audio (MP3/WAV).');
                return;
            }

            uploadText.classList.add('hidden');
            fileInfo.classList.remove('hidden');
            fileNameDisplay.textContent = file.name;
            
            stopAudio(); // Hentikan audio sebelumnya jika ada
            playBtn.disabled = true;
            playText.textContent = 'Memproses Audio...';

            try {
                const arrayBuffer = await file.arrayBuffer();
                
                if (!audioContext) {
                    audioContext = new (window.AudioContext || window.webkitAudioContext)();
                }
                
                // Decode file hingga level sample-rate untuk menghilangkan celah milidetik
                audioBuffer = await audioContext.decodeAudioData(arrayBuffer);
                
                playBtn.disabled = false;
                exportBtn.disabled = false;
                playText.textContent = 'Play Seamless Preview';
            } catch (error) {
                alert('Gagal memproses file audio. Coba file lain.');
                playText.textContent = 'Play Seamless Preview';
            }
        }

        // Putar audio
        function playAudio() {
            if (!audioContext || !audioBuffer) return;

            sourceNode = audioContext.createBufferSource();
            sourceNode.buffer = audioBuffer;
            sourceNode.loop = true; // Parameter vital agar loop mulus tanpa gap
            
            sourceNode.connect(audioContext.destination);
            sourceNode.start(0);
            
            isPlaying = true;
            playIcon.textContent = '⏹';
            playText.textContent = 'Stop Preview';
            
            // Ubah gaya tombol ke mode Stop (Merah)
            playBtn.classList.replace('bg-teal-500', 'bg-rose-500');
            playBtn.classList.replace('hover:bg-teal-400', 'hover:bg-rose-400');
            playBtn.classList.replace('text-gray-900', 'text-white');
            playBtn.classList.remove('hover:glow-teal');
        }

        // Hentikan audio
        function stopAudio() {
            if (sourceNode) {
                sourceNode.stop();
                sourceNode.disconnect();
            }
            isPlaying = false;
            if(playIcon) playIcon.textContent = '▶️';
            if(playText) playText.textContent = 'Play Seamless Preview';
            
            // Kembalikan gaya tombol ke mode Play (Teal)
            playBtn.classList.replace('bg-rose-500', 'bg-teal-500');
            playBtn.classList.replace('hover:bg-rose-400', 'hover:bg-teal-400');
            playBtn.classList.replace('text-white', 'text-gray-900');
            playBtn.classList.add('hover:glow-teal');
        }

        // Handle klik tombol
        playBtn.addEventListener('click', () => {
            if (isPlaying) stopAudio();
            else playAudio();
        });

        exportBtn.addEventListener('click', () => {
            alert('Untuk ekspor file 2 jam, blok ini nantinya akan dihubungkan dengan integrasi FFmpeg.wasm agar proses render berjalan secara background.');
        });
    </script>
</body>
</html>
